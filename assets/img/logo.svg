<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo Haddad GPS — versión SVG vectorial premium
  Diseñado con la paleta oficial (naranja, negro, blanco).
  Puede sustituirse por el logo real PNG/SVG del cliente.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Haddad GPS">
    <defs>
        <linearGradient id="hg-orange" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#ffb347"/>
            <stop offset="55%" stop-color="#ff8a00"/>
            <stop offset="100%" stop-color="#e67600"/>
        </linearGradient>
        <linearGradient id="hg-dark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#222"/>
            <stop offset="100%" stop-color="#111"/>
        </linearGradient>
        <filter id="hg-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Fondo circular oscuro -->
    <circle cx="120" cy="120" r="110" fill="url(#hg-dark)"/>
    <circle cx="120" cy="120" r="110" fill="none" stroke="url(#hg-orange)" stroke-width="3"/>

    <!-- Rejilla / ondas satelitales -->
    <g stroke="rgba(255,138,0,0.18)" stroke-width="1" fill="none">
        <circle cx="120" cy="120" r="50"/>
        <circle cx="120" cy="120" r="70"/>
        <circle cx="120" cy="120" r="90"/>
    </g>

    <!-- Líneas de mapa estilizadas -->
    <g stroke="rgba(255,138,0,0.25)" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M30 90 Q90 70 150 95 T220 75"/>
        <path d="M30 150 Q80 130 140 165 T220 145"/>
        <path d="M30 180 Q100 160 170 185 T220 175"/>
    </g>

    <!-- Pin GPS central -->
    <g filter="url(#hg-glow)">
        <path d="M120 55
                 C146 55 167 76 167 102
                 C167 138 120 185 120 185
                 C120 185 73 138 73 102
                 C73 76 94 55 120 55 Z"
              fill="url(#hg-orange)"/>
        <circle cx="120" cy="102" r="18" fill="#111"/>
        <circle cx="120" cy="102" r="9"  fill="#fff"/>
    </g>

    <!-- Texto HADDAD GPS -->
    <g font-family="'Urbanist','Poppins',sans-serif" font-weight="900" text-anchor="middle">
        <text x="120" y="215" font-size="22" fill="#fff" letter-spacing="2">HADDAD</text>
    </g>
</svg>
