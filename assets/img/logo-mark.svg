<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo mark / isotipo solo pin (uso compacto en header/footer) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Haddad GPS">
    <defs>
        <linearGradient id="m-orange" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#ffb347"/>
            <stop offset="60%" stop-color="#ff8a00"/>
            <stop offset="100%" stop-color="#e67600"/>
        </linearGradient>
    </defs>

    <!-- Anillo satelital -->
    <circle cx="32" cy="30" r="26" fill="none" stroke="rgba(255,138,0,0.35)" stroke-width="1.4" stroke-dasharray="2 3"/>

    <!-- Pin -->
    <path d="M32 6
             C40.8 6 48 13.2 48 22
             C48 34.5 32 56 32 56
             C32 56 16 34.5 16 22
             C16 13.2 23.2 6 32 6 Z"
          fill="url(#m-orange)"/>
    <circle cx="32" cy="22" r="7" fill="#111"/>
    <circle cx="32" cy="22" r="3" fill="#fff"/>
</svg>
